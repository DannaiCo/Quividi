<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=600, height=1440, initial-scale=1.0" />
    <title>Audiencia Quividi</title>

    <!-- Open Sans ExtraBold -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,800;1,800&display=swap"
      rel="stylesheet" />

    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 600px;
        height: 1440px;
        overflow: hidden;
        background: #1237f5;
      }

      #screen {
        position: relative;
        width: 600px;
        height: 1440px;
        overflow: hidden;
        background: #1237f5;
      }

      /* Video de fondo */
      #background-video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 0;
        pointer-events: none;
      }

      /*
      Caja del número.
      El video ya contiene la línea amarilla y el texto "Personas".
      Solo colocamos el número encima.
    */
      #number {
        position: absolute;
        left: 50px;
        top: 706px;
        width: 500px;
        height: 184px;
        z-index: 1;
        overflow: hidden;

        display: flex;
        align-items: center;
        justify-content: center;

        color: #ffffff;
        font-family: "Open Sans", sans-serif;
        font-size: 300px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -5px;
        white-space: nowrap;
      }

      #number span {
        display: block;
        flex: 0 0 auto;
        white-space: nowrap;
      }

      /* Evita que se vea un cursor o selección en pantalla */
      body {
        user-select: none;
        -webkit-user-select: none;
      }
    </style>
  </head>

  <body>
    <div id="screen">
      <video id="background-video" autoplay muted loop playsinline preload="auto">
        <source src="fondo.mp4" type="video/mp4" />
      </video>

      <div id="number"><span id="value">—</span></div>
    </div>

    <script>
      const API_URL =
        "https://script.google.com/macros/s/AKfycbwit61z9FuDCP5pg-U9v3Xpa5xl9RSXjbjWFofnY3kmmaR6RKCjqjo2-l5WW0wt5ZYfHQ/exec";

      // Lee el ID desde la URL:
      // https://tu-github.github.io/tu-repo/?id=141983
      const params = new URLSearchParams(window.location.search);

      // ID para pruebas
      const TEST_ID = "142909";

      // Si viene ?id= en la URL usa ese.
      // Si no viene, usa TEST_ID.
      const screenId = params.get("id") || TEST_ID;

      const numberElement = document.getElementById("number");
      const valueElement = document.getElementById("value");

      // Rango normal de trabajo. Si el contenido todavía no cabe a 24 px,
      // la función sigue reduciendo la fuente como medida de seguridad.
      const MIN_FONT_SIZE = 100;
      const MAX_FONT_SIZE = 400;

      let currentValue = null;

      function formatNumber(value) {
        return Number(value).toLocaleString("es-CO");
      }

      function fitNumber() {
        const availableWidth = numberElement.clientWidth;
        const availableHeight = numberElement.clientHeight;

        let low = MIN_FONT_SIZE;
        let high = MAX_FONT_SIZE;
        let bestSize = MIN_FONT_SIZE;

        // Busca el mayor tamaño de fuente que cabe tanto en ancho como en alto.
        while (low <= high) {
          const testSize = Math.floor((low + high) / 2);
          valueElement.style.fontSize = testSize + "px";

          const rect = valueElement.getBoundingClientRect();
          const fits = rect.width <= availableWidth && rect.height <= availableHeight;

          if (fits) {
            bestSize = testSize;
            low = testSize + 1;
          } else {
            high = testSize - 1;
          }
        }

        valueElement.style.fontSize = bestSize + "px";

        // Garantía adicional: si ni siquiera el mínimo configurado cabe,
        // continúa reduciendo hasta que el contenido quede dentro de la caja.
        let safeSize = bestSize;
        let rect = valueElement.getBoundingClientRect();

        while ((rect.width > availableWidth || rect.height > availableHeight) && safeSize > 1) {
          safeSize -= 1;
          valueElement.style.fontSize = safeSize + "px";
          rect = valueElement.getBoundingClientRect();
        }
      }

      function setDisplayedValue(value) {
        valueElement.textContent = value;
        fitNumber();
      }

      function animateNumber(from, to, duration = 2200) {
        const startTime = performance.now();

        function frame(now) {
          const progress = Math.min((now - startTime) / duration, 1);

          // Ease-out: empieza rápido y termina suave.
          const eased = 1 - Math.pow(1 - progress, 4);

          const value = Math.round(from + (to - from) * eased);

          setDisplayedValue(formatNumber(value));

          if (progress < 1) {
            requestAnimationFrame(frame);
          } else {
            setDisplayedValue(formatNumber(to));
          }
        }

        requestAnimationFrame(frame);
      }

      async function loadData() {
        if (!screenId) {
          setDisplayedValue("—");
          console.error("Falta el parámetro ?id=");
          return;
        }

        try {
          const response = await fetch(API_URL + "?id=" + encodeURIComponent(screenId) + "&t=" + Date.now(), {
            method: "GET",
            cache: "no-store"
          });

          if (!response.ok) {
            throw new Error("HTTP " + response.status);
          }

          const data = await response.json();

          if (data.error || data.data === "" || data.data === null || data.data === undefined) {
            throw new Error("El endpoint no devolvió un dato válido.");
          }

          const newValue = Number(data.data);

          if (!Number.isFinite(newValue)) {
            throw new Error("El dato recibido no es numérico.");
          }

          if (currentValue === null) {
            // Primera carga: cuenta desde 0.
            currentValue = 0;
          }

          if (newValue !== currentValue) {
            animateNumber(currentValue, newValue);
            currentValue = newValue;
          } else {
            setDisplayedValue(formatNumber(newValue));
          }
        } catch (error) {
          console.error("Error cargando Quividi:", error);

          // Si ya tenemos un dato válido, lo conservamos.
          // Nunca reemplazamos el dato por cero por un error de conexión.
          if (currentValue !== null) {
            setDisplayedValue(formatNumber(currentValue));
          } else {
            setDisplayedValue("—");
          }
        }
      }

      // Recalcula el tamaño cuando la fuente web haya terminado de cargar.
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(fitNumber);
      }

      window.addEventListener("resize", fitNumber);

      // Primera consulta
      loadData();

      // Consulta nuevos datos cada 5 minutos
      setInterval(loadData, 5 * 60 * 1000);

      // Repite la animación del número cada 12 segundos
      setInterval(() => {
        if (currentValue !== null) {
          animateNumber(0, currentValue);
        }
      }, 12 * 1000);
    </script>
  </body>
</html>
