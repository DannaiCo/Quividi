<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />

  <!--
    IMPORTANTE:
    El viewport se adapta al tamaño real del navegador/player.
    El diseño interno seguirá trabajando siempre a 2560x1440.
  -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Audiencia Quividi</title>

  <!-- Open Sans ExtraBold -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,800;1,800&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --ancho-lienzo: 2560;
      --alto-lienzo: 1440;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #1237f5;
    }

    body {
      position: relative;

      user-select: none;
      -webkit-user-select: none;

      /* Evita scroll accidental en algunos players */
      overscroll-behavior: none;
    }

    /*
      =====================================================
      LIENZO MAESTRO
      =====================================================

      Todo el diseño se construye internamente a:

      2560 x 1440

      Después JavaScript escala TODO el lienzo según
      el tamaño real disponible en el navegador/player.
    */
    #screen {
      position: absolute;

      left: 0;
      top: 0;

      width: 2560px;
      height: 1440px;

      overflow: hidden;

      background: #1237f5;

      transform-origin: top left;

      /*
        Ayuda al navegador/player con el renderizado
        cuando el elemento está escalado.
      */
      will-change: transform;
    }

    /*
      =====================================================
      VIDEO DE FONDO
      =====================================================
    */
    #background-video {
      position: absolute;

      left: 0;
      top: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;
      object-position: center center;

      z-index: 0;

      pointer-events: none;
    }

    /*
      =====================================================
      CAJA DEL NÚMERO
      =====================================================

      Estas coordenadas permanecen exactamente en el
      sistema de diseño 2560x1440.

      El video ya contiene:
      - la línea
      - el texto "Personas"

      Aquí únicamente colocamos el número.
    */
    #number {
      position: absolute;

      left: 500px;
      top: 575px;

      width: 1484px;
      height: 300px;

      z-index: 1;

      overflow: hidden;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #ffffff;

      font-family: "Open Sans", Arial, sans-serif;
      font-size: 500px;
      font-weight: 800;

      line-height: 1;

      letter-spacing: -5px;

      white-space: nowrap;
    }

    #number span {
      display: block;

      flex: 0 0 auto;

      white-space: nowrap;

      line-height: 1;
    }
  </style>
</head>

<body>

  <!--
    =====================================================
    LIENZO 2560x1440
    =====================================================
  -->
  <div id="screen">

    <!-- VIDEO -->
    <video
      id="background-video"
      autoplay
      muted
      loop
      playsinline
      preload="auto"
    >
      <source src="fondo.mp4" type="video/mp4" />
    </video>

    <!-- NÚMERO -->
    <div id="number">
      <span id="value">—</span>
    </div>

  </div>


  <script>
    /*
      =====================================================
      CONFIGURACIÓN GENERAL
      =====================================================
    */

    const DESIGN_WIDTH = 2560;
    const DESIGN_HEIGHT = 1440;

    const API_URL =
      "https://script.google.com/macros/s/AKfycbwit61z9FuDCP5pg-U9v3Xpa5xl9RSXjbjWFofnY3kmmaR6RKCjqjo2-l5WW0wt5ZYfHQ/exec";


    /*
      =====================================================
      ELEMENTOS
      =====================================================
    */

    const screenElement =
      document.getElementById("screen");

    const numberElement =
      document.getElementById("number");

    const valueElement =
      document.getElementById("value");

    const videoElement =
      document.getElementById("background-video");


    /*
      =====================================================
      ID DE PANTALLA
      =====================================================

      Ejemplo:

      https://tu-github.github.io/tu-repo/?id=141983
    */

    const params =
      new URLSearchParams(window.location.search);

    // ID utilizado cuando la URL no contiene ?id=
    const TEST_ID = "142867";

    // Si existe ?id= usa ese.
    // Si no existe, usa TEST_ID.
    const screenId =
      params.get("id") || TEST_ID;


    /*
      =====================================================
      ESCALADO RESPONSIVE DEL LIENZO
      =====================================================

      El diseño SIEMPRE mide internamente:

      2560 x 1440

      Esta función calcula cuánto debe escalarse para
      caber en el viewport real.

      Ejemplos:

      2560x1440 -> escala 1
      1920x1080 -> escala 0.75
      1280x720  -> escala 0.50
    */

    let currentScale = 1;

    function scaleScreen() {

      const viewportWidth =
        window.innerWidth;

      const viewportHeight =
        window.innerHeight;

      const scaleX =
        viewportWidth / DESIGN_WIDTH;

      const scaleY =
        viewportHeight / DESIGN_HEIGHT;

      /*
        Math.min evita deformar el diseño.

        El lienzo conserva siempre la proporción 16:9.
      */
      currentScale =
        Math.min(scaleX, scaleY);

      /*
        Aplicamos el escalado a TODO:
        - video
        - número
        - posiciones
        - tamaños
      */
      screenElement.style.transform =
        `scale(${currentScale})`;

      /*
        Calculamos el tamaño final después del escalado.
      */
      const scaledWidth =
        DESIGN_WIDTH * currentScale;

      const scaledHeight =
        DESIGN_HEIGHT * currentScale;

      /*
        Centramos el lienzo en caso de que el viewport
        tenga una relación de aspecto distinta a 16:9.
      */
      const offsetX =
        (viewportWidth - scaledWidth) / 2;

      const offsetY =
        (viewportHeight - scaledHeight) / 2;

      screenElement.style.left =
        offsetX + "px";

      screenElement.style.top =
        offsetY + "px";
    }


    /*
      =====================================================
      TAMAÑO DEL NÚMERO
      =====================================================
    */

    const MIN_FONT_SIZE = 100;
    const MAX_FONT_SIZE = 500;

    /*
      IMPORTANTE:

      Aquí NO usamos getBoundingClientRect() para medir
      el número porque #screen utiliza transform: scale().

      getBoundingClientRect() devuelve las dimensiones
      VISUALES después del escalado.

      scrollWidth / scrollHeight trabajan con las
      dimensiones internas del lienzo 2560x1440.
    */

    function numberFits() {

      const availableWidth =
        numberElement.clientWidth;

      const availableHeight =
        numberElement.clientHeight;

      const contentWidth =
        valueElement.scrollWidth;

      const contentHeight =
        valueElement.scrollHeight;

      return (
        contentWidth <= availableWidth &&
        contentHeight <= availableHeight
      );
    }


    function fitNumber() {

      const availableWidth =
        numberElement.clientWidth;

      const availableHeight =
        numberElement.clientHeight;

      if (
        availableWidth <= 0 ||
        availableHeight <= 0
      ) {
        return;
      }

      let low = MIN_FONT_SIZE;
      let high = MAX_FONT_SIZE;

      let bestSize = MIN_FONT_SIZE;


      /*
        Búsqueda binaria:

        Busca rápidamente el tamaño máximo posible
        que cabe dentro de la caja.
      */
      while (low <= high) {

        const testSize =
          Math.floor((low + high) / 2);

        valueElement.style.fontSize =
          testSize + "px";

        if (numberFits()) {

          bestSize = testSize;

          low =
            testSize + 1;

        } else {

          high =
            testSize - 1;
        }
      }


      valueElement.style.fontSize =
        bestSize + "px";


      /*
        Seguridad adicional.

        Si incluso MIN_FONT_SIZE fuera demasiado grande,
        seguimos reduciendo hasta que realmente quepa.
      */
      let safeSize = bestSize;

      while (
        !numberFits() &&
        safeSize > 1
      ) {

        safeSize -= 1;

        valueElement.style.fontSize =
          safeSize + "px";
      }
    }


    /*
      =====================================================
      FORMATO DEL NÚMERO
      =====================================================
    */

    function formatNumber(value) {

      return Number(value).toLocaleString(
        "es-CO"
      );
    }


    /*
      =====================================================
      MOSTRAR VALOR
      =====================================================
    */

    function setDisplayedValue(value) {

      valueElement.textContent =
        value;

      fitNumber();
    }


    /*
      =====================================================
      ANIMACIÓN
      =====================================================
    */

    let currentValue = null;


    function animateNumber(
      from,
      to,
      duration = 2200
    ) {

      const startTime =
        performance.now();


      function frame(now) {

        const progress =
          Math.min(
            (now - startTime) / duration,
            1
          );


        /*
          Ease Out Quart

          Empieza rápido y termina suavemente.
        */
        const eased =
          1 - Math.pow(
            1 - progress,
            4
          );


        const value =
          Math.round(
            from +
            (to - from) *
            eased
          );


        setDisplayedValue(
          formatNumber(value)
        );


        if (progress < 1) {

          requestAnimationFrame(frame);

        } else {

          setDisplayedValue(
            formatNumber(to)
          );
        }
      }


      requestAnimationFrame(frame);
    }


    /*
      =====================================================
      CARGAR DATOS DE QUIVIDI
      =====================================================
    */

    async function loadData() {

      if (!screenId) {

        setDisplayedValue("—");

        console.error(
          "Falta el parámetro ?id="
        );

        return;
      }


      try {

        const requestURL =
          API_URL +
          "?id=" +
          encodeURIComponent(screenId) +
          "&t=" +
          Date.now();


        const response =
          await fetch(
            requestURL,
            {
              method: "GET",
              cache: "no-store"
            }
          );


        if (!response.ok) {

          throw new Error(
            "HTTP " +
            response.status
          );
        }


        const data =
          await response.json();


        if (
          data.error ||
          data.data === "" ||
          data.data === null ||
          data.data === undefined
        ) {

          throw new Error(
            "El endpoint no devolvió un dato válido."
          );
        }


        const newValue =
          Number(data.data);


        if (!Number.isFinite(newValue)) {

          throw new Error(
            "El dato recibido no es numérico."
          );
        }


        /*
          Primera carga:

          hacemos la animación desde cero.
        */
        if (currentValue === null) {

          currentValue = 0;
        }


        /*
          Si el dato cambió:
          anima desde el dato anterior hasta el nuevo.
        */
        if (newValue !== currentValue) {

          const previousValue =
            currentValue;

          currentValue =
            newValue;

          animateNumber(
            previousValue,
            newValue
          );

        } else {

          setDisplayedValue(
            formatNumber(newValue)
          );
        }


      } catch (error) {

        console.error(
          "Error cargando Quividi:",
          error
        );


        /*
          Si ya tenemos un valor válido,
          lo conservamos.

          Un error de internet nunca debe mostrar 0.
        */
        if (currentValue !== null) {

          setDisplayedValue(
            formatNumber(currentValue)
          );

        } else {

          setDisplayedValue("—");
        }
      }
    }


    /*
      =====================================================
      VIDEO
      =====================================================
    */

    /*
      Algunos players DOOH/WebView necesitan que play()
      se intente explícitamente aunque exista autoplay.
    */
    function startVideo() {

      if (!videoElement) {
        return;
      }

      const playPromise =
        videoElement.play();

      if (
        playPromise !== undefined
      ) {

        playPromise.catch(
          function(error) {

            console.warn(
              "El reproductor no inició automáticamente:",
              error
            );
          }
        );
      }
    }


    /*
      =====================================================
      FUENTES
      =====================================================
    */

    /*
      Esperamos a que Open Sans termine de cargar
      para calcular nuevamente el tamaño del número.
    */
    if (
      document.fonts &&
      document.fonts.ready
    ) {

      document.fonts.ready.then(
        function() {

          fitNumber();
        }
      );
    }


    /*
      =====================================================
      RESIZE
      =====================================================
    */

    function handleResize() {

      scaleScreen();

      fitNumber();
    }


    window.addEventListener(
      "resize",
      handleResize
    );


    window.addEventListener(
      "orientationchange",
      function() {

        setTimeout(
          handleResize,
          100
        );
      }
    );


    /*
      =====================================================
      INICIO
      =====================================================
    */

    /*
      1. Escalamos inmediatamente.
    */
    scaleScreen();


    /*
      2. Intentamos iniciar el video.
    */
    startVideo();


    /*
      3. Primera consulta a Quividi.
    */
    loadData();


    /*
      =====================================================
      ACTUALIZACIÓN DE DATOS
      =====================================================

      Consulta Quividi cada 5 minutos.
    */

    setInterval(
      loadData,
      180 * 60 * 1000
    );


    /*
      =====================================================
      REPETICIÓN DE LA ANIMACIÓN
      =====================================================

      Cada 12 segundos vuelve a contar desde cero
      hasta el valor actual.
    */

    setInterval(
      function() {

        if (currentValue !== null) {

          animateNumber(
            0,
            currentValue
          );
        }
      },
      12 * 1000
    );

  </script>

</body>
</html>
